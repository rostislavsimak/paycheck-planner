/* Layout: calm single-column app — slim top bar, 4-tab nav (bottom bar on phones), one primary action per screen; forms live in bottom sheets */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f6; --fg:#1b2333; --muted:#667189; --line:#e1e5ee;
  --accent:#3b5bdb; --accent-fg:#ffffff; --accent-soft:#e6ebff;
  --safe:#13805a; --safe-soft:#e1f4ec; --warn:#985a00; --warn-soft:#fdf0d9; --danger:#b9473f; --danger-soft:#fbe6e2;
  --scrim:rgba(10,16,32,.5);
  --radius:16px;
  --display:"Bricolage",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --font:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}

const FAQ={};
FAQ.en=[
["My data disappeared","Make sure you opened the app in the same browser and on the same device, and not in a private window. If it's still missing, go to Setup → Restore backup and choose your latest backup file."],
["My payday changed","Go to Setup and set “A recent or upcoming payday” to the new date. Every paycheck is recalculated instantly."],
["My paycheck amount is different each time","Enter your usual take-home pay in Setup. Then, on the Paychecks tab, type the difference in Extra income: a positive number if it was bigger, a negative one if it was smaller."],
["Safe to spend is red or zero","You've planned or spent more than this paycheck covers. Stop non-essential spending until payday, lower a savings amount for now, or check for a purchase logged twice."],
["How do I use it on my phone?","Open the app link in Safari (iPhone) or Chrome (Android). On iPhone tap Share → Add to Home Screen; on Android tap ⋮ → Add to Home screen. It then opens like a regular app."],
["Can I use it on two devices?","Each device keeps its own data. Download a backup on one device and restore it on the other when you switch. There is no automatic sync."],
["What about yearly or irregular bills?","Create a savings goal, for example “Car registration” with a target of 240 and 10 per paycheck. When the bill arrives, the money is ready."],
["Does the app connect to my bank?","No. Nothing is connected or uploaded. You type in your numbers and they stay on your device."],
["How do I start over?","Setup → Start over → Erase everything (tap twice to confirm). Download a backup first if you might want your data back."]
];
FAQ.es=[
["Mis datos han desaparecido","Comprueba que abriste la app en el mismo navegador y dispositivo, y no en una ventana privada. Si siguen sin aparecer, ve a Ajustes → Restaurar copia y elige tu última copia."],
["Ha cambiado mi día de cobro","Ve a Ajustes y pon la nueva fecha en «Un día de cobro reciente o próximo». Todos los sueldos se recalculan al instante."],
["Mi sueldo cambia cada vez","Pon tu sueldo neto habitual en Ajustes. Luego, en Pagos, escribe la diferencia en Ingreso extra: positiva si fue mayor, negativa si fue menor."],
["Lo que puedo gastar está en rojo o a cero","Has planificado o gastado más de lo que cubre este sueldo. Frena lo no esencial hasta el cobro, reduce un ahorro por ahora o revisa si anotaste una compra dos veces."],
["¿Cómo la uso en el móvil?","Abre el enlace de la app en Safari (iPhone) o Chrome (Android). En iPhone toca Compartir → Añadir a pantalla de inicio; en Android toca ⋮ → Añadir a pantalla de inicio. Se abrirá como una app normal."],
["¿Puedo usarla en dos dispositivos?","Cada dispositivo guarda sus propios datos. Descarga una copia en uno y restáurala en el otro cuando cambies. No hay sincronización automática."],
["¿Y los pagos anuales o irregulares?","Crea una meta de ahorro, por ejemplo «Impuesto del coche» con objetivo 240 y 10 por sueldo. Cuando llegue el pago, el dinero estará listo."],
["¿La app se conecta a mi banco?","No. No se conecta ni se sube nada. Tú escribes tus números y se quedan en tu dispositivo."],
["¿Cómo empiezo de cero?","Ajustes → Empezar de cero → Borrar todo (toca dos veces para confirmar). Descarga antes una copia si quizá quieras recuperar los datos."]
];
FAQ.fr=[
["Mes données ont disparu","Vérifiez que vous avez ouvert l'app dans le même navigateur, sur le même appareil, et pas en navigation privée. Sinon, allez dans Réglages → Restaurer une sauvegarde et choisissez la plus récente."],
["Mon jour de paie a changé","Dans Réglages, mettez la nouvelle date dans « Un jour de paie récent ou à venir ». Toutes les paies sont recalculées aussitôt."],
["Ma paie change à chaque fois","Indiquez votre salaire net habituel dans Réglages. Puis, dans Paies, saisissez l'écart dans Revenu en plus : positif si c'était plus, négatif si c'était moins."],
["Le montant dépensable est rouge ou à zéro","Vous avez prévu ou dépensé plus que ce que couvre cette paie. Stoppez le non essentiel jusqu'à la paie, réduisez une épargne pour l'instant, ou vérifiez un achat noté deux fois."],
["Comment l'utiliser sur mon téléphone ?","Ouvrez le lien de l'app dans Safari (iPhone) ou Chrome (Android). Sur iPhone : Partager → Sur l'écran d'accueil ; sur Android : ⋮ → Ajouter à l'écran d'accueil. Elle s'ouvre alors comme une app."],
["Puis-je l'utiliser sur deux appareils ?","Chaque appareil garde ses propres données. Téléchargez une sauvegarde sur l'un et restaurez-la sur l'autre quand vous changez. Pas de synchronisation automatique."],
["Et les dépenses annuelles ou irrégulières ?","Créez un objectif d'épargne, par exemple « Carte grise » avec une cible de 240 et 10 par paie. Quand la facture arrive, l'argent est prêt."],
["L'app se connecte-t-elle à ma banque ?","Non. Rien n'est connecté ni envoyé. Vous saisissez vos chiffres et ils restent sur votre appareil."],
["Comment tout recommencer ?","Réglages → Recommencer → Tout effacer (touchez deux fois pour confirmer). Téléchargez d'abord une sauvegarde si vous voulez pouvoir revenir en arrière."]
];
FAQ.de=[
["Meine Daten sind weg","Prüfe, ob du die App im selben Browser und auf demselben Gerät geöffnet hast und nicht im privaten Modus. Falls weiterhin nichts da ist: Einstellungen → Sicherung wiederherstellen und die neueste Sicherung wählen."],
["Mein Zahltag hat sich geändert","Trage in den Einstellungen das neue Datum bei „Ein letzter oder nächster Zahltag“ ein. Alle Gehälter werden sofort neu berechnet."],
["Mein Gehalt ist jedes Mal anders","Trage dein übliches Nettogehalt in den Einstellungen ein. Unter Gehälter gibst du dann die Differenz bei Zusatzeinkommen ein: positiv, wenn mehr kam, negativ, wenn weniger."],
["Der sichere Betrag ist rot oder null","Du hast mehr verplant oder ausgegeben, als dieses Gehalt deckt. Stoppe Unnötiges bis zum Zahltag, reduziere vorerst einen Sparbetrag oder prüfe, ob ein Einkauf doppelt erfasst ist."],
["Wie nutze ich sie auf dem Handy?","Öffne den App-Link in Safari (iPhone) oder Chrome (Android). Auf dem iPhone: Teilen → Zum Home-Bildschirm; auf Android: ⋮ → Zum Startbildschirm hinzufügen. Dann öffnet sie sich wie eine normale App."],
["Kann ich sie auf zwei Geräten nutzen?","Jedes Gerät speichert eigene Daten. Lade auf einem Gerät eine Sicherung herunter und stelle sie beim Wechsel auf dem anderen wieder her. Es gibt keine automatische Synchronisierung."],
["Und jährliche oder unregelmäßige Kosten?","Lege ein Sparziel an, z. B. „Kfz-Steuer“ mit Zielbetrag 240 und 10 pro Gehalt. Wenn die Rechnung kommt, ist das Geld da."],
["Verbindet sich die App mit meiner Bank?","Nein. Nichts wird verbunden oder hochgeladen. Du gibst deine Zahlen selbst ein und sie bleiben auf deinem Gerät."],
["Wie fange ich neu an?","Einstellungen → Neu beginnen → Alles löschen (zweimal tippen zum Bestätigen). Lade vorher eine Sicherung herunter, falls du die Daten noch brauchst."]
];
FAQ.it=[
["I miei dati sono spariti","Controlla di aver aperto l'app nello stesso browser e sullo stesso dispositivo, e non in una finestra privata. Se mancano ancora, vai in Impostazioni → Ripristina backup e scegli il backup più recente."],
["Il mio giorno di paga è cambiato","Vai in Impostazioni e metti la nuova data in «Un giorno di paga recente o in arrivo». Tutti gli stipendi vengono ricalcolati subito."],
["Il mio stipendio cambia ogni volta","Inserisci in Impostazioni lo stipendio netto abituale. Poi, nella scheda Stipendi, scrivi la differenza in Entrate extra: positiva se è arrivato di più, negativa se di meno."],
["Quanto posso spendere è rosso o a zero","Hai pianificato o speso più di quanto copre questo stipendio. Ferma le spese non essenziali fino alla paga, riduci per ora un risparmio o controlla di non aver registrato un acquisto due volte."],
["Come la uso sul telefono?","Apri il link dell'app in Safari (iPhone) o Chrome (Android). Su iPhone tocca Condividi → Aggiungi alla schermata Home; su Android tocca ⋮ → Aggiungi a schermata Home. Si aprirà come una normale app."],
["Posso usarla su due dispositivi?","Ogni dispositivo conserva i propri dati. Scarica un backup su uno e ripristinalo sull'altro quando cambi. Non c'è sincronizzazione automatica."],
["E le spese annuali o irregolari?","Crea un obiettivo di risparmio, per esempio «Bollo auto» con traguardo 240 e 10 a stipendio. Quando arriva il pagamento, i soldi sono pronti."],
["L'app si collega alla mia banca?","No. Non si collega a nulla e non carica niente. Inserisci tu i tuoi numeri e restano sul tuo dispositivo."],
["Come ricomincio da zero?","Impostazioni → Ricomincia → Cancella tutto (tocca due volte per confermare). Prima scarica un backup se potresti voler recuperare i dati."]
];

it:[["Ciao! 👋","Tour veloce, 1 minuto. Sono numeri d'esempio, non i tuoi soldi. Scegli lingua, valuta e colori:"],["Il tuo unico numero","È quanto puoi spendere oggi per arrivare allo stipendio. Arancione = vai piano. Rosso = stop extra. L'acqua dell'onsen scende man mano che spendi; tocca il capibara per strizzarlo."],["Hai speso qualcosa?","Tocca qui. Scrivi l'importo, scegli la categoria, fatto. Cinque secondi."],["Le bollette vanno da sole","Le bollette in scadenza prima dello stipendio compaiono qui da sole. Spuntale quando le paghi."],["Tutto il resto","Bollette e Obiettivi: li aggiungi una volta sola. Debiti, anno, impostazioni e aiuto sono nel menu (su telefono in Altro)."],["Tutto qui!","Ora 3 domande veloci sul tuo stipendio. Puoi rivedere il tour quando vuoi in Altro → Aiuto."]],
es:[["¡Hola! 👋","Visita rápida, 1 minuto. Son números de ejemplo, no tu dinero. Elige idioma, moneda y colores:"],["Tu único número","Es lo que puedes gastar hoy y llegar al cobro. Naranja = con calma. Rojo = nada de extras. El agua del onsen baja cuando gastas; toca al capibara para apretarlo."],["¿Has gastado algo?","Toca aquí. Escribe el importe, elige categoría y listo. Cinco segundos."],["Las facturas van solas","Las facturas que vencen antes del cobro aparecen aquí solas. Márcalas al pagarlas."],["Todo lo demás","Facturas y Metas: se añaden una sola vez. Deudas, año, ajustes y ayuda están en el menú (en el móvil, en Más)."],["¡Eso es todo!","Ahora 3 preguntas rápidas sobre tu sueldo. Puedes repetir la visita en Más → Ayuda."]],
fr:[["Bonjour ! 👋","Visite rapide, 1 minute. Ce sont des chiffres d'exemple, pas votre argent. Choisissez langue, devise et couleurs :"],["Votre seul chiffre","C'est ce que vous pouvez dépenser aujourd'hui en tenant jusqu'à la paie. Orange = doucement. Rouge = stop extras. L'eau de l'onsen baisse quand tu dépenses ; touche le capybara pour le serrer."],["Une dépense ?","Touchez ici. Le montant, une catégorie, c'est fait. Cinq secondes."],["Les factures se gèrent seules","Les factures dues avant la paie apparaissent ici toutes seules. Cochez-les une fois payées."],["Tout le reste","Factures et Objectifs : à ajouter une seule fois. Dettes, année, réglages et aide sont dans le menu (sur téléphone, dans Plus)."],["C'est tout !","Maintenant 3 questions rapides sur votre paie. Revoir la visite : Plus → Aide."]],
de:[["Hallo! 👋","Kurze Tour, 1 Minute. Das sind Beispielzahlen, nicht dein Geld. Wähle Sprache, Währung und Farben:"],["Deine eine Zahl","So viel kannst du heute ausgeben und kommst trotzdem bis zum Zahltag. Orange = langsam. Rot = keine Extras. Das Wasser im Onsen sinkt, wenn du ausgibst; tippe aufs Wasserschwein, um es zu drücken."],["Was ausgegeben?","Hier tippen. Betrag, Kategorie, fertig. Fünf Sekunden."],["Rechnungen laufen von selbst","Rechnungen, die vor dem Zahltag fällig sind, erscheinen hier von selbst. Abhaken, wenn bezahlt."],["Alles andere","Rechnungen und Ziele: einmal eintragen. Schulden, Jahr, Einstellungen und Hilfe findest du im Menü (am Handy unter Mehr)."],["Das war's!","Jetzt 3 kurze Fragen zu deinem Gehalt. Die Tour gibt's jederzeit unter Mehr → Hilfe."]]
};

const GUIDE={
en:[["The big number","It's what you can spend today. Paycheck + extra income − bills due before payday − savings − extra debt payment − what you've spent, divided by the days to payday."],["Colors","Green: on track. Orange: under 10% of the paycheck left, essentials only. Red: you're over, pause extras until payday."],["Add a spending","Tap “+ Add spending”, type the amount, pick a category, Save. Mistake? Tap the purchase in the list to delete it. Don't add bills here: they're counted automatically."],["Bills","Add each monthly bill once: name, amount, due day. Day 29–31 uses the last day in shorter months. Tick it on Today when paid. Yearly bills? Make a savings goal instead. Tap a bill to change or delete it."],["Savings goals","Pick an amount per paycheck: it's set aside automatically. When you actually move the money, tap “I set aside…”. Tap again to undo."],["Debts","More → Debts. Add balance, interest and minimum payment. Snowball pays the smallest first, avalanche the highest interest first. Update balances once a month."],["Paychecks and year","More → Paychecks shows what's left in the next paychecks; got more or less than usual? Type the difference there. More → Year shows months with 3 paydays: perfect for saving."],["Privacy and backup","Your data stays only in this browser on this device. Download a backup every week in More → Setup. To change phone, restore that file there."],["2-minute routine","Daily: check the number, add purchases. Payday: move savings, tap the buttons. Monthly: update debts, download a backup."]],
it:[["Il numero grande","È quanto puoi spendere oggi. Stipendio + entrate extra − bollette prima dello stipendio − risparmi − rata extra − già speso, diviso per i giorni allo stipendio."],["I colori","Verde: in linea. Arancione: resta meno del 10% dello stipendio, solo l'essenziale. Rosso: hai sforato, stop extra fino allo stipendio."],["Aggiungere una spesa","Tocca «+ Aggiungi spesa», scrivi l'importo, scegli la categoria, Salva. Hai sbagliato? Tocca la spesa nell'elenco per eliminarla. Le bollette non vanno qui: sono già contate."],["Bollette","Aggiungi ogni bolletta mensile una volta: nome, importo, giorno di scadenza. I giorni 29–31 diventano l'ultimo giorno nei mesi più corti. Spuntala in Oggi quando la paghi. Spese annuali? Crea un obiettivo. Tocca una bolletta per modificarla o eliminarla."],["Obiettivi di risparmio","Scegli una cifra per stipendio: viene messa da parte in automatico. Quando sposti davvero i soldi, tocca «Ho messo da parte…». Toccalo di nuovo per annullare."],["Debiti","Altro → Debiti. Inserisci saldo, interesse e rata minima. Valanga di neve estingue prima il più piccolo, slavina prima l'interesse più alto. Aggiorna i saldi una volta al mese."],["Stipendi e anno","Altro → Stipendi mostra quanto resta nei prossimi stipendi; hai preso più o meno del solito? Scrivi lì la differenza. Altro → Anno mostra i mesi con 3 stipendi: perfetti per risparmiare."],["Privacy e backup","I dati restano solo in questo browser su questo dispositivo. Scarica un backup ogni settimana in Altro → Impostazioni. Se cambi telefono, ripristina lì quel file."],["Routine da 2 minuti","Ogni giorno: guarda il numero, aggiungi le spese. Giorno di paga: sposta i risparmi, tocca i pulsanti. Ogni mese: aggiorna i debiti, scarica un backup."]],
es:[["El número grande","Es lo que puedes gastar hoy. Sueldo + ingresos extra − facturas antes del cobro − ahorro − pago extra de deuda − lo gastado, dividido entre los días hasta el cobro."],["Los colores","Verde: vas bien. Naranja: queda menos del 10% del sueldo, solo lo esencial. Rojo: te has pasado, frena los extras hasta el cobro."],["Añadir un gasto","Toca «+ Añadir gasto», escribe el importe, elige categoría y Guardar. ¿Error? Toca el gasto en la lista para borrarlo. Las facturas no van aquí: ya se cuentan solas."],["Facturas","Añade cada factura mensual una vez: nombre, importe, día de vencimiento. Los días 29–31 pasan al último día en meses cortos. Márcala en Hoy al pagarla. ¿Pagos anuales? Crea una meta. Toca una factura para cambiarla o borrarla."],["Metas de ahorro","Elige una cantidad por sueldo: se aparta sola. Cuando muevas de verdad el dinero, toca «He apartado…». Vuelve a tocar para deshacer."],["Deudas","Más → Deudas. Añade saldo, interés y pago mínimo. Bola de nieve paga primero la menor; avalancha, el interés más alto. Actualiza los saldos cada mes."],["Sueldos y año","Más → Sueldos muestra lo que queda en los próximos sueldos; ¿cobraste más o menos? Escribe ahí la diferencia. Más → Año muestra los meses con 3 cobros: ideales para ahorrar."],["Privacidad y copia","Tus datos solo están en este navegador de este dispositivo. Descarga una copia cada semana en Más → Ajustes. Si cambias de móvil, restáurala allí."],["Rutina de 2 minutos","Cada día: mira el número, añade gastos. Día de cobro: mueve el ahorro, toca los botones. Cada mes: actualiza deudas, descarga una copia."]],
fr:[["Le grand chiffre","C'est ce que vous pouvez dépenser aujourd'hui. Paie + revenus en plus − factures avant la paie − épargne − remboursement en plus − déjà dépensé, divisé par les jours jusqu'à la paie."],["Les couleurs","Vert : tout va bien. Orange : moins de 10 % de la paie restante, l'essentiel seulement. Rouge : dépassement, stop extras jusqu'à la paie."],["Ajouter une dépense","Touchez « + Ajouter une dépense », le montant, une catégorie, Enregistrer. Une erreur ? Touchez la dépense dans la liste pour la supprimer. Pas de factures ici : elles sont déjà comptées."],["Factures","Ajoutez chaque facture mensuelle une fois : nom, montant, jour d'échéance. Les jours 29–31 passent au dernier jour des mois courts. Cochez-la dans Aujourd'hui une fois payée. Dépense annuelle ? Créez un objectif. Touchez une facture pour la modifier ou la supprimer."],["Objectifs d'épargne","Choisissez un montant par paie : il est mis de côté automatiquement. Quand vous virez vraiment l'argent, touchez « J'ai mis de côté… ». Touchez à nouveau pour annuler."],["Dettes","Plus → Dettes. Indiquez solde, taux et paiement minimum. Boule de neige rembourse d'abord la plus petite, avalanche le taux le plus élevé. Mettez les soldes à jour chaque mois."],["Paies et année","Plus → Paies montre ce qui reste sur les prochaines paies ; touché plus ou moins que d'habitude ? Indiquez l'écart. Plus → Année montre les mois à 3 paies : parfaits pour épargner."],["Confidentialité et sauvegarde","Vos données restent uniquement dans ce navigateur, sur cet appareil. Téléchargez une sauvegarde chaque semaine dans Plus → Réglages. Nouveau téléphone ? Restaurez-y ce fichier."],["Routine de 2 minutes","Chaque jour : regardez le chiffre, ajoutez vos achats. Jour de paie : virez l'épargne, touchez les boutons. Chaque mois : mettez à jour les dettes, téléchargez une sauvegarde."]],
de:[["Die große Zahl","So viel kannst du heute ausgeben. Gehalt + Zusatzeinkommen − Rechnungen bis zum Zahltag − Sparen − Sondertilgung − schon Ausgegebenes, geteilt durch die Tage bis zum Zahltag."],["Die Farben","Grün: alles im Plan. Orange: weniger als 10 % vom Gehalt übrig, nur Nötiges. Rot: drüber, keine Extras bis zum Zahltag."],["Ausgabe hinzufügen","Tippe „+ Ausgabe hinzufügen“, Betrag eingeben, Kategorie wählen, Speichern. Vertippt? Tippe die Ausgabe in der Liste an, um sie zu löschen. Rechnungen nicht hier: Die werden automatisch gezählt."],["Rechnungen","Trag jede monatliche Rechnung einmal ein: Name, Betrag, Fälligkeitstag. Tag 29–31 wird in kürzeren Monaten zum letzten Tag. Unter Heute abhaken, wenn bezahlt. Jährliche Kosten? Leg ein Ziel an. Tippe eine Rechnung an, um sie zu ändern oder zu löschen."],["Sparziele","Wähle einen Betrag pro Gehalt: Er wird automatisch zurückgelegt. Wenn du das Geld wirklich überweist, tippe „… zurückgelegt“. Nochmal tippen macht es rückgängig."],["Schulden","Mehr → Schulden. Restschuld, Zins und Mindestrate eintragen. Schneeball tilgt zuerst die kleinste, Lawine den höchsten Zins. Restschulden einmal im Monat aktualisieren."],["Gehälter und Jahr","Mehr → Gehälter zeigt, was in den nächsten Gehältern übrig bleibt; mehr oder weniger bekommen? Trag dort die Differenz ein. Mehr → Jahr zeigt Monate mit 3 Zahltagen: ideal zum Sparen."],["Datenschutz und Sicherung","Deine Daten bleiben nur in diesem Browser auf diesem Gerät. Lade jede Woche unter Mehr → Einstellungen eine Sicherung herunter. Neues Handy? Dort wiederherstellen."],["2-Minuten-Routine","Täglich: Zahl ansehen, Ausgaben eintragen. Zahltag: Sparbeträge überweisen, Buttons tippen. Monatlich: Schulden aktualisieren, Sicherung herunterladen."]]
};
FAQ.en[2]=["My paycheck amount is different each time","Enter your usual take-home pay in Setup. When a paycheck is different, open More → Paychecks and type the difference: positive if bigger, negative if smaller."];
FAQ.it[2]=["Il mio stipendio cambia ogni volta","Metti lo stipendio netto abituale in Impostazioni. Quando uno è diverso, apri Altro → Stipendi e scrivi la differenza: positiva se è di più, negativa se è di meno."];
FAQ.es[2]=["Mi sueldo cambia cada vez","Pon tu sueldo neto habitual en Ajustes. Cuando uno sea distinto, abre Más → Sueldos y escribe la diferencia: positiva si fue mayor, negativa si fue menor."];
FAQ.fr[2]=["Ma paie change à chaque fois","Indiquez votre salaire net habituel dans Réglages. Quand une paie diffère, ouvrez Plus → Paies et saisissez l'écart : positif si plus, négatif si moins."];
FAQ.de[2]=["Mein Gehalt ist jedes Mal anders","Trag dein übliches Nettogehalt in den Einstellungen ein. Ist ein Gehalt anders, öffne Mehr → Gehälter und trag die Differenz ein: positiv bei mehr, negativ bei weniger."];
FAQ.en[8]=["How do I start over?","More → Setup → Erase everything (tap twice). Download a backup first if you might want your data back."];
FAQ.it[8]=["Come ricomincio da zero?","Altro → Impostazioni → Cancella tutto (tocca due volte). Prima scarica un backup se potresti volere i dati indietro."];
FAQ.es[8]=["¿Cómo empiezo de cero?","Más → Ajustes → Borrar todo (toca dos veces). Antes descarga una copia si quizá quieras recuperar los datos."];
FAQ.fr[8]=["Comment tout recommencer ?","Plus → Réglages → Tout effacer (touchez deux fois). Téléchargez d'abord une sauvegarde si besoin."];
FAQ.de[8]=["Wie fange ich neu an?","Mehr → Einstellungen → Alles löschen (zweimal tippen). Lade vorher eine Sicherung herunter, falls du die Daten noch brauchst."];

 and:["Installa MacroDroid (gratis) e copia il link Android qui sopra.","Nuova macro → Attivatore: Notifica → scegli la tua banca o Google Wallet.","Azione: Apri sito web / URL → incolla il link e sostituisci NOTIFICATION con il testo magico [notification].","Salva. L'app legge l'importo dalla notifica e si apre pronta da salvare."]},
es:{ios:["Copia el enlace de iPhone de arriba.","Abre Atajos → Automatización → + → Transacción.","Elige tus tarjetas, selecciona «Ejecutar inmediatamente», toca Siguiente → Nueva automatización en blanco.","Añade la acción «URL» y pega el enlace. Sustituye AMOUNT por la variable «Importe» y MERCHANT por «Comercio».","Añade la acción «Abrir URL». Listo: tras cada pago con Apple Pay la app se abre rellenada; elige categoría y Guardar."],

 and:["Instala MacroDroid (gratis) y copia el enlace de Android de arriba.","Nueva macro → Disparador: Notificación → elige tu banco o Google Wallet.","Acción: Abrir sitio web / URL → pega el enlace y sustituye NOTIFICATION por el texto mágico [notification].","Guarda. La app lee el importe de la notificación y se abre lista para guardar."]},
fr:{ios:["Copiez le lien iPhone ci-dessus.","Ouvrez Raccourcis → Automatisation → + → Transaction.","Choisissez vos cartes, sélectionnez « Exécuter immédiatement », touchez Suivant → Nouvelle automatisation vierge.","Ajoutez l'action « URL » et collez le lien. Remplacez AMOUNT par la variable « Montant » et MERCHANT par « Commerçant ».","Ajoutez l'action « Ouvrir les URL ». C'est fait : après chaque paiement Apple Pay, l'app s'ouvre pré-remplie ; choisissez la catégorie et Enregistrez."],

 and:["Installez MacroDroid (gratuit) et copiez le lien Android ci-dessus.","Nouvelle macro → Déclencheur : Notification → choisissez votre banque ou Google Wallet.","Action : Ouvrir un site web / URL → collez le lien et remplacez NOTIFICATION par le texte magique [notification].","Enregistrez. L'app lit le montant dans la notification et s'ouvre prête à enregistrer."]},
de:{ios:["Kopiere den iPhone-Link oben.","Öffne Kurzbefehle → Automation → + → Transaktion.","Wähle deine Karten, dann „Sofort ausführen“, tippe Weiter → Neue leere Automation.","Füge die Aktion „URL“ hinzu und füge den Link ein. Ersetze AMOUNT durch die Variable „Betrag“ und MERCHANT durch „Händler“.","Füge die Aktion „URLs öffnen“ hinzu. Fertig: Nach jeder Apple-Pay-Zahlung öffnet sich die App ausgefüllt – Kategorie wählen, Speichern."],

function num(v){if(typeof v==="number")return isFinite(v)?v:0;let s=String(v==null?"":v).trim().replace(/[\s ']/g,"");const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");

  const n=parseFloat(s.replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0;}
function currencyOptions(sel){
  let codes;try{codes=Intl.supportedValuesOf("currency");}catch(e){codes=FALLBACK_CUR;}
  let dn=null;try{dn=new Intl.DisplayNames([loc()],{type:"currency"});}catch(e){}
  const name=c=>{let n=c;try{n=dn?dn.of(c):c;}catch(e){}let sym="";try{sym=new Intl.NumberFormat(loc(),{style:"currency",currency:c,currencyDisplay:"narrowSymbol"}).formatToParts(0).find(p=>p.type==="currency").value;}catch(e){}
    return n+(sym&&sym!==c?" ("+sym+")":"")+" — "+c;};
  const top=TOP_CUR.filter(c=>codes.includes(c));const rest=codes.filter(c=>!top.includes(c)).sort((a,b)=>name(a).localeCompare(name(b),loc()));
  if(!codes.includes(sel))rest.unshift(sel);

/* ---------- pay periods ---------- */
function periodStartFor(date){
  const f=S.settings.freq,a=parse(S.settings.anchor);
  if(f==="weekly"||f==="biweekly"){const step=f==="weekly"?7:14;const k=Math.floor(dayDiff(a,date)/step);return addDays(a,k*step);}
  if(f==="semimonthly"){return new Date(date.getFullYear(),date.getMonth(),date.getDate()>=15?15:1);}
  const day=a.getDate();const thisM=new Date(date.getFullYear(),date.getMonth(),Math.min(day,dim(date.getFullYear(),date.getMonth())));
  if(date>=thisM)return thisM;const pm=new Date(date.getFullYear(),date.getMonth()-1,1);return new Date(pm.getFullYear(),pm.getMonth(),Math.min(day,dim(pm.getFullYear(),pm.getMonth())));
}
function nextStart(start){
  const f=S.settings.freq;
  if(f==="weekly")return addDays(start,7);if(f==="biweekly")return addDays(start,14);
  if(f==="semimonthly")return start.getDate()===1?new Date(start.getFullYear(),start.getMonth(),15):new Date(start.getFullYear(),start.getMonth()+1,1);
  const day=parse(S.settings.anchor).getDate();const nm=new Date(start.getFullYear(),start.getMonth()+1,1);return new Date(nm.getFullYear(),nm.getMonth(),Math.min(day,dim(nm.getFullYear(),nm.getMonth())));
}
function period(start){const end=addDays(nextStart(start),-1);return{start,end,key:iso(start)};}
function currentPeriod(){return period(periodStartFor(today()));}
function periodsBetween(from,to){const out=[];let s=periodStartFor(from);let g=0;while(s<=to&&g++<400){out.push(period(s));s=nextStart(s);}return out;}

/* ---------- money in a period ---------- */
function dueItems(p){
  const items=[];const months=[];let c=new Date(p.start.getFullYear(),p.start.getMonth(),1);
  while(c<=p.end){months.push(new Date(c));c=new Date(c.getFullYear(),c.getMonth()+1,1);}
  const add=(src,type)=>{for(const m of months){const d=new Date(m.getFullYear(),m.getMonth(),Math.min(src.dueDay||1,dim(m.getFullYear(),m.getMonth())));
    if(d>=p.start&&d<=p.end){const key=(type==="debt"?"d:":"b:")+src.id+":"+ym(d);items.push({type,id:src.id,name:src.name,amount:type==="debt"?num(src.minPayment):num(src.amount),date:d,key,autopay:!!src.autopay,paid:!!S.paid[key]});}}};
  S.bills.forEach(b=>add(b,"bill"));S.debts.filter(d=>num(d.balance)>0&&num(d.minPayment)>0).forEach(d=>add(d,"debt"));
  return items.sort((a,b)=>a.date-b.date);
}
function summary(p){
  const income=num(S.settings.payAmount)+num(S.incomeAdj[p.key]);
  const items=dueItems(p);const bills=items.reduce((s,i)=>s+i.amount,0);const billsLeft=items.filter(i=>!i.paid).reduce((s,i)=>s+i.amount,0);
  const savings=S.goals.filter(g=>!num(g.target)||num(g.saved)<num(g.target)||S.saved[p.key+":"+g.id]).reduce((s,g)=>s+num(g.perPaycheck),0);
  const extraDebt=S.debts.some(d=>num(d.balance)>0)?num(S.settings.extraDebt):0;
  const exps=S.expenses.filter(e=>{const d=parse(e.date);return d>=p.start&&d<=p.end;});
  const spent=exps.reduce((s,e)=>s+num(e.amount),0);
  const left=income-bills-savings-extraDebt-spent;
  const td=today();const daysLeft=td>=p.start&&td<=p.end?dayDiff(td,p.end)+1:(td<p.start?dayDiff(p.start,p.end)+1:0);
  return{income,items,bills,billsLeft,savings,extraDebt,spent,exps,left,daysLeft,perDay:daysLeft>0?left/daysLeft:left};
}

/* ---------- debt payoff ---------- */
function payoff(){
  const debts=S.debts.filter(d=>num(d.balance)>0).map(d=>({id:d.id,name:d.name,bal:num(d.balance),apr:num(d.apr),min:Math.max(num(d.minPayment),0),done:null}));
  if(!debts.length)return null;
  const budget=debts.reduce((s,d)=>s+d.min,0)+num(S.settings.extraDebt)*PER_MONTH[S.settings.freq];
  let month=0,interest=0;
  while(debts.some(d=>d.bal>0.005)&&month<600){
    month++;const before=debts.reduce((s,d)=>s+d.bal,0);
    debts.forEach(d=>{if(d.bal>0){const i=d.bal*d.apr/1200;d.bal+=i;interest+=i;}});
    let pool=budget;
    debts.forEach(d=>{if(d.bal>0){const p=Math.min(d.min,d.bal);d.bal-=p;pool-=p;}});
    const order=debts.filter(d=>d.bal>0).sort(S.settings.strategy==="avalanche"?(a,b)=>b.apr-a.apr||a.bal-b.bal:(a,b)=>a.bal-b.bal||b.apr-a.apr);
    for(const d of order){if(pool<=0)break;const p=Math.min(pool,d.bal);d.bal-=p;pool-=p;}
    debts.forEach(d=>{if(d.bal<=0.005&&d.done===null){d.bal=0;d.done=month;}});
    if(debts.reduce((s,d)=>s+d.bal,0)>=before-0.005)break;
  }
  const stuck=debts.some(d=>d.done===null);
  return{budget,months:stuck?null:month,interest,order:debts.slice().sort((a,b)=>(a.done??9999)-(b.done??9999))};
}

/* ---------- seasonal scene: illustration per season x money state, with light ambient motion ---------- */
const SCENE_IMG=new Set(["autumn-1", "autumn-2", "autumn-3", "autumn-4", "autumn-5", "christmas-1", "christmas-2", "christmas-3", "christmas-4", "christmas-5", "easter-1", "easter-2", "easter-3", "easter-4", "easter-5", "spring-1", "spring-2", "spring-3", "spring-4", "spring-5", "summer-1", "summer-2", "summer-3", "summer-4", "summer-5", "valentine-1", "valentine-2", "valentine-3", "valentine-4", "valentine-5", "winter-1", "winter-2", "winter-3", "winter-4", "winter-5"]);
const SEASON_OF=["winter","winter","spring","spring","spring","summer","summer","summer","autumn","autumn","autumn","winter"];
const SCENE_ON=(()=>{try{const q=new URLSearchParams(location.search).get("scene");if(q==="0")localStorage.setItem("pp.scene","0");if(q==="1")localStorage.removeItem("pp.scene");return localStorage.getItem("pp.scene")!=="0";}catch(e){return true;}})();
const SEASON_FORCE=(()=>{try{localStorage.removeItem("pp.season");return new URLSearchParams(location.search).get("season");}catch(e){return null;}})();
/* holidays replace the season for a few days, but only once their pictures are in SCENE_IMG (?season=halloween forces one for testing) */
const HOLIDAYS=["halloween","christmas","easter","valentine"];
function easterSunday(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return new Date(y,Math.floor(n/31)-1,n%31+1);}
function holidayOf(t){
  const md=(t.getMonth()+1)*100+t.getDate();
  if(md>=1025&&md<=1101)return"halloween";     /* 25 Oct - 1 Nov */
  if(md>=1208||md<=106)return"christmas";      /* 8 Dec - 6 Jan */
  if(md>=210&&md<=214)return"valentine";       /* 10 - 14 Feb */
  const e=Math.round((t-easterSunday(t.getFullYear()))/864e5);
  return e>=-7&&e<=1?"easter":null;            /* Palm Sunday - Easter Monday */
}
function sceneTheme(){
  const t=today(),f=SEASON_FORCE;
  if(SEASON_OF.includes(f)||HOLIDAYS.includes(f))return f;
  const h=holidayOf(t);
  return h&&[1,2,3,4,5].some(i=>SCENE_IMG.has(h+"-"+i))?h:SEASON_OF[t.getMonth()];
}
let lastScene=null,lastStep=0,lastLeft=null;
/* money left in 20% steps: 5 = 100-80% ... 1 = 20-0%; a missing picture falls back to the nearest step, then to the season's base */
function sceneStep(p){return p>.8?5:p>.6?4:p>.4?3:p>.2?2:1;}
function sceneKey(p){
  const se=sceneTheme(),st=sceneStep(p);
  for(const d of [0,-1,1,-2,2,-3,3,-4,4]){const k=se+"-"+(st+d);if(SCENE_IMG.has(k))return k;}
  return se;
}
function sceneTween(from,to){
  const el=document.querySelector(".hero .sm-amt");if(!el)return;
  const box=el.closest(".hchip")||el.parentNode;box.classList.remove("bump");void box.offsetWidth;box.classList.add("bump");
  const t0=performance.now(),D=1500,ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  const tick=now=>{if(!el.isConnected)return;const k=Math.min(1,(now-t0)/D);el.textContent=money(Math.max(0,from+(to-from)*ease(k)));if(k<1)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}
function rnd(i,n){const x=Math.sin(i*127.1+n*311.7)*43758.5453;return x-Math.floor(x);}

function sceneFx(se){

  if(se==="winter")fall(36,{d0:7,d1:7,sx:60,s0:2.5,s1:4.5,r:0});
  if(se==="autumn")fall(14,{d0:9,d1:6,sx:140,s0:12,s1:10,r:340,svg:LEAF,c:["#e0662b","#f2a03a","#c9442c","#e9b949","#b5532a"]});
  if(se==="spring")fall(16,{d0:10,d1:6,sx:110,s0:8,s1:7,r:260,svg:PETAL,c:["#f7b6c8","#f9c9d6","#f19bb5","#fde2ea"]});

    h+=`<span class="fly" style="--y:34%;--d:18s;--dl:-5s;color:#f6c343">${FLY}</span><span class="fly" style="--y:46%;--d:23s;--dl:-14s;color:#a78bfa">${FLY}</span>`;}
  if(se==="valentine")fall(14,{d0:10,d1:6,sx:90,s0:10,s1:8,r:40,svg:HEART,c:["#f43f5e","#fb7185","#f9a8d4","#e11d48"]});
  if(se==="summer"){
    for(let i=0;i<12;i++)h+=`<span class="tw" style="--x:${(8+rnd(i,7)*84).toFixed(1)}%;--y:${(48+rnd(i,8)*40).toFixed(1)}%;--s:${(8+rnd(i,9)*10).toFixed(0)}px;--d:${(2.4+rnd(i,10)*2.4).toFixed(1)}s;--dl:${(-rnd(i,11)*4).toFixed(1)}s">${STAR}</span>`;
    h+=`<span class="fly" style="--y:30%;--d:16s;--dl:-3s;color:#f2994a">${FLY}</span><span class="fly" style="--y:42%;--d:21s;--dl:-12s;color:#9b7be0">${FLY}</span>`;
  }

function sceneArt(p,left){
  p=Math.max(0,Math.min(1,p||0));const k=sceneKey(p),se=k.split("-")[0];
  const step=sceneStep(p),moved=lastScene&&lastScene!==k&&!calm();
  const prev=moved?lastScene:null,up=moved&&step>lastStep,from=lastLeft;lastScene=k;lastStep=step;lastLeft=left;
  if(from!==null&&Math.abs(from-left)>.004&&!calm())requestAnimationFrame(()=>{const e=document.querySelector(".hero .sm-amt");if(e)e.textContent=money(Math.max(0,from));sceneTween(from,left);});
  let glints="";if(up)for(let i=0;i<10;i++)glints+=`<span class="glint" style="--x:${(4+rnd(i,21)*30).toFixed(1)}%;--y:${(26+rnd(i,22)*16).toFixed(1)}%;--s:${(10+rnd(i,23)*10).toFixed(0)}px;--dl:${(.5+rnd(i,24)*.9).toFixed(2)}s">${STAR.replace('#fff','#ffe27a')}</span>`;
  return `<div class="scene sc-${se}" role="img" aria-label="${esc(T("scene.left"))}: ${esc(money(left))}">
  <div class="scene-bg sb-${k}${prev?" in":""}"></div>${prev?`<div class="scene-bg sb-${prev} out"></div>`:""}
  <div class="scene-fx" aria-hidden="true">${sceneFx(se)}${glints}</div>
  ${step===1?`<span class="scene-note${prev?" in":""}">${T("cozy."+se)}</span>`:""}
  </div>`;
}

function squish(el){

}

/* ---------- gentle motion (off with "Less motion" or the system's Reduce Motion) ---------- */
function calm(){return S.settings.motion==="less"||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);}
function motion(mv,same,old){
  if(prevDemo!==demo){prevSafe=null;prevDemo=demo;}
  const hero=tab==="today"?mv.querySelector(".hero .big"):null;
  const safeNow=hero?Math.max(summary(currentPeriod()).perDay,0):null;
  const ons=mv.querySelector(".onsen");const drop=dropRipple;dropRipple=false;
  if(calm()){if(safeNow!==null)prevSafe=safeNow;return;}
  if(ons){
    const to=ons.style.getPropertyValue("--lvl");
    if(old.lvl&&old.lvl!==to){ons.classList.add("still");ons.style.setProperty("--lvl",old.lvl);void ons.offsetWidth;ons.classList.remove("still");ons.style.setProperty("--lvl",to);}
    if(drop){const fx=ons.querySelectorAll(".ripple");fx.forEach(e=>e.classList.add("go"));setTimeout(()=>fx.forEach(e=>e.classList.remove("go")),2600);}
  }
  if(!same){
    mv.classList.remove("enter");void mv.offsetWidth;let i=0;
    [...mv.children].forEach(el=>{if(el.classList.contains("col"))[...el.children].forEach(c=>c.style.setProperty("--i",i++));else el.style.setProperty("--i",i++);});
    mv.classList.add("enter");clearTimeout(motion.t);motion.t=setTimeout(()=>mv.classList.remove("enter"),1400);
  }else{
    const bars=[...mv.querySelectorAll(".bar i")];
    if(bars.length===old.bars.length)bars.forEach((b,k)=>{const to=b.style.width,from=old.bars[k];if(from&&from!==to){b.style.transition="none";b.style.width=from;void b.offsetWidth;b.style.transition="width .7s cubic-bezier(.2,.8,.2,1)";b.style.width=to;}});
    mv.querySelectorAll("input[data-paid]:checked").forEach(x=>{if(!old.paid.has(x.dataset.paid)){const r=x.closest(".item");if(r)r.classList.add("just-done");}});
    mv.querySelectorAll("[data-save-goal]:not(.soft)").forEach(b=>{if(!old.goals.has(b.dataset.saveGoal))cheer(b);});
  }
  if(hero&&safeNow!==null){const from=prevSafe===null?0:prevSafe;if(Math.abs(from-safeNow)>0.004)countTo(hero,from,safeNow,prevSafe===null?800:650);}
  if(safeNow!==null)prevSafe=safeNow;
}
function countTo(el,a,b,ms){
  const t0=performance.now();const ease=x=>1-Math.pow(1-x,3);
  el.textContent=money(a);
  const step=now=>{if(!el.isConnected)return;const x=Math.min(1,(now-t0)/ms);el.textContent=money(a+(b-a)*ease(x));
    if(x<1)requestAnimationFrame(step);else{el.textContent=money(b);el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}};
  requestAnimationFrame(step);
}
function cheer(btn){
  const box=document.createElement("span");box.className="cheer";box.setAttribute("aria-hidden","true");
  for(let i=0;i<12;i++){const d=document.createElement("i");d.style.setProperty("--a",(i*30+8)+"deg");d.style.setProperty("--d",(34+(i%3)*12)+"px");box.appendChild(d);}
  btn.appendChild(box);setTimeout(()=>box.remove(),1000);
}

/* ---------- events ---------- */
function armed(el,label){if(el.dataset.armed)return false;const orig=el.textContent;el.dataset.armed="1";el.textContent=label;setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=orig;}},4000);return true;}
document.addEventListener("click",ev=>{
  if(ev.target.classList&&ev.target.classList.contains("sheet-back")){closeSheet();return;}
  const el=ev.target.closest("button");if(!el)return;const ds=el.dataset;
  if(ds.tour){
    if(ds.tour==="next"){tour.i=Math.min(STEPS.length-1,tour.i+1);showStep();}
    else if(ds.tour==="back"){tour.i=Math.max(0,tour.i-1);showStep();}
    else endTour(ds.tour);
    return;}
  if(ds.palette){S.settings.palette=ds.palette;if(tour){tour.real.settings.palette=ds.palette;showStep();}else{save();render();}const b=document.querySelector('.swatch[data-palette="'+ds.palette+'"]');if(b)b.focus({preventScroll:true});return;}
  if(ds.act==="squish"){squish(el);return;}
  if(tour)return;
  if(ds.copy){const i=document.getElementById(ds.copy);if(!i)return;const done=()=>toast(t("al.copied"));if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(i.value).then(done,()=>{i.select();document.execCommand("copy");done();});else{i.select();document.execCommand("copy");done();}return;}
  if(ds.close){closeSheet();return;}
  if(ds.tab){closeSheet();go(ds.tab);return;}
  if(ds.open){const f={spend:openSpend,exp:openExp,bill:openBill,debt:openDebt,goal:openGoal}[ds.open];if(f)f(ds.id);return;}
  if(ds.cat){selCat=ds.cat;document.querySelectorAll(".cat[data-cat]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.cat===selCat));return;}
  if(ds.del&&sheetCtx){if(armed(el,t("sh.del2")))return;const c=sheetCtx;
    const m={exp:["expenses","toast.removed"],bill:["bills","bi.deleted"],debt:["debts","d.deleted"],goal:["goals","s.deleted"]}[c.type];
    if(m){S[m[0]]=S[m[0]].filter(x=>x.id!==c.id);save();closeSheet();render();toast(t(m[1]));}return;}
  if(ds.saveGoal){const g=S.goals.find(x=>x.id===ds.saveGoal);if(!g)return;const k=currentPeriod().key+":"+g.id;
    if(S.saved[k]){delete S.saved[k];g.saved=Math.max(0,num(g.saved)-num(g.perPaycheck));toast(t("s.undone"));}
    else{S.saved[k]=true;g.saved=num(g.saved)+num(g.perPaycheck);toast(num(g.target)&&g.saved>=num(g.target)?t("s.reachedToast"):t("s.savedToast",money0(num(g.perPaycheck))));}
    save();render();return;}
  if(ds.strategy){S.settings.strategy=ds.strategy;save();render();const d=document.querySelector("#view details.card");if(d)d.open=true;return;}
  if(ds.year){yearSel+=Number(ds.year);render();return;}
  if(ds.act==="expAll"){showAllExp=!showAllExp;render();return;}
  if(ds.act==="billsAll"){showAllBills=!showAllBills;render();return;}
  if(ds.act==="tour"){startTour();return;}
  if(ds.act==="install"){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;render();});}return;}
  if(ds.act==="installLater"){S.installDismissed=true;save();render();return;}
  if(ds.act==="backupLater"){S.backupSnooze=Date.now()+14*864e5;save();render();return;}
  if(ds.act==="export"){S.lastBackup=Date.now();save();const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="paycheck-planner-backup-"+iso(today())+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast(t("se.dlDone"));return;}
  if(ds.act==="sample"){if(armed(el,t("se.confReplace")))return;S=buildSample(S.settings);save();render();toast(t("se.sampleLoaded"));return;}
  if(ds.act==="reset"){if(armed(el,t("se.confErase")))return;const l=S.settings.lang,c=S.settings.currency,pl=S.settings.palette;S=blank();S.settings.lang=l;S.settings.currency=c;S.settings.palette=pl;save();tab="today";render();startTour();return;}
  if(ds.wz){
    if(ds.wz==="next"){S.settings.payAmount=num($("#oPay").value);S.settings.freq=$("#oFreq").value;S.settings.anchor=$("#oAnchor").value||iso(today());S.settings.currency=$("#oCur").value;save();wz=1;renderWizard();render();return;}
    if(ds.wz==="bills"){tab="bills";closeWizard();return;}
    if(ds.wz==="today"){tab="today";closeWizard();return;}
  }
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="tLang"||el.id==="tCur"){
    if(el.id==="tLang"){S.settings.lang=el.value;tour.real.settings.lang=el.value;}
    else{S.settings.currency=el.value;if(!tour.real.onboarded)tour.real.settings.currency=el.value;}
    S=buildSample(S.settings);showStep();const f=$("#"+el.id);if(f)f.focus();return;}
  if(tour){if(el.closest&&el.closest("#view"))render();return;}
  if(el.dataset.paid){const k=el.dataset.paid;let wait=250;if(el.checked){S.paid[k]=true;toast(t("toast.paid"));const row=el.closest(".item");if(row&&!calm()){row.classList.add("paid-out");wait=700;}}else delete S.paid[k];save();setTimeout(render,wait);return;}
  if(el.dataset.adj){const v=num(el.value);if(v)S.incomeAdj[el.dataset.adj]=v;else delete S.incomeAdj[el.dataset.adj];save();render();return;}
  if(el.id==="extraDebt"){S.settings.extraDebt=num(el.value);save();render();const d=document.querySelector("#view details.card");if(d)d.open=true;return;}
  if(el.id==="sLang"){S.settings.lang=el.value;save();render();return;}
  if(el.id==="importFile"&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.settings||!Array.isArray(d.bills))throw 0;S=hydrate(d);S.onboarded=true;S.tourSeen=true;save();render();toast(t("se.restored"));}catch(e){toast(t("se.bad"));}};r.readAsText(el.files[0]);}
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();const f=ev.target;if(tour)return;const c=sheetCtx||{};
  const upsert=(arr,obj,msgEdit,msgAdd)=>{if(c.id){Object.assign(S[arr].find(x=>x.id===c.id),obj);toast(t(msgEdit));}else{S[arr].push(Object.assign({id:uid()},obj));toast(t(msgAdd));}save();closeSheet();render();};
  if(f.id==="spendForm"){const amt=num($("#expAmt").value);if(amt<=0){toast(t("toast.amount"));$("#expAmt").focus();return;}
    const note=($("#expNote")&&$("#expNote").value.trim())||"";const e={id:uid(),date:($("#expDate")&&$("#expDate").value)||iso(today()),amount:amt,category:selCat,note,ts:Date.now()};S.expenses.push(e);rememberCat(note,selCat);save();dropRipple=true;closeSheet();tab="today";render();toast(t("toast.logged",money(amt)),()=>{S.expenses=S.expenses.filter(x=>x.id!==e.id);save();render();});return;}
  if(f.id==="billForm"){upsert("bills",{name:$("#bName").value.trim(),amount:num($("#bAmt").value),dueDay:Math.min(31,Math.max(1,parseInt($("#bDay").value)||1)),category:$("#bCat").value,autopay:$("#bAuto").checked},"bi.saved","bi.added");return;}
  if(f.id==="debtForm"){upsert("debts",{name:$("#dName").value.trim(),balance:num($("#dBal").value),apr:num($("#dApr").value),minPayment:num($("#dMin").value),dueDay:Math.min(31,Math.max(1,parseInt($("#dDay").value)||1))},"d.saved","d.added");return;}
  if(f.id==="goalForm"){upsert("goals",{name:$("#gName").value.trim(),target:num($("#gTarget").value),saved:num($("#gSaved").value),perPaycheck:num($("#gPer").value)},"s.saved","s.added");return;}
  if(f.id==="setForm"){S.settings.payAmount=num($("#sPay").value);S.settings.freq=$("#sFreq").value;S.settings.anchor=$("#sAnchor").value||S.settings.anchor;S.settings.currency=$("#sCur").value;S.settings.lang=$("#sLang").value;S.settings.theme=$("#sTheme").value;S.settings.motion=$("#sMotion").value;save();render();toast(t("se.saved"));return;}
  if(f.id==="bucketForm"){document.querySelectorAll("[data-bucket]").forEach(i=>{const v=num(i.value);if(v>0)S.buckets[i.dataset.bucket]=v;else delete S.buckets[i.dataset.bucket];});save();render();toast(t("se.limitsSaved"));return;}
});
document.addEventListener("keydown",ev=>{
  if(!tour){if(ev.key==="Escape"&&sheetCtx)closeSheet();return;}
  const typing=/INPUT|SELECT/.test(document.activeElement.tagName);
  if(ev.key==="Escape")endTour(tour.real.onboarded?"end":"own");
  else if(ev.key==="ArrowRight"&&!typing&&tour.i<STEPS.length-1){tour.i++;showStep();}
  else if(ev.key==="ArrowLeft"&&!typing&&tour.i>0){tour.i--;showStep();}
});
window.addEventListener("hashchange",()=>{const x=location.hash.slice(1);if(tour||/^add/.test(x))return;if((TABS.includes(x)||SUB.includes(x))&&x!==tab){tab=x;render();}});
window.addEventListener("storage",e=>{if(e.key===KEY&&!demo){S=load();render();}});
window.addEventListener("resize",()=>{if(tour){clearTimeout(window.__rt);window.__rt=setTimeout(showStep,150);}});

/* ---------- quick add from link (Apple Pay Shortcuts, MacroDroid, quick button) ---------- */
const KW={groceries:["lidl","aldi","esselunga","coop","conad","carrefour","eurospin","pam ","penny","spar","walmart","tesco","kroger","rewe","edeka","mercadona","sainsbury","asda","whole foods","trader joe","costco","safeway","netto","kaufland","dia ","auchan","leclerc","intermarch","supermerc","supermarket"],
 gas:["shell","esso","eni","q8","bp ","chevron","exxon","tamoil","repsol","aral","totalenergies","texaco","circle k","benzin","carbur","fuel"],
 eating:["starbucks","chipotle","taco","wendy","five guys","pret","costa","nando","autogrill","mcdonald","burger","kfc","subway","domino","pizz","bar ","caff","cafe","coffee","ristor","restaurant","trattoria","osteria","sushi","deliveroo","uber eats","glovo","just eat","doordash","grubhub","wolt","lieferando","bäck","bakery","panific"],
 fun:["cinema","steam","playstation","xbox","nintendo","ticketmaster","eventbrite","museum","museo","bowling"],
 household:["ikea","leroy","brico","obi ","home depot","lowe","action","tiger","maisons du monde"],
 health:["farmacia","pharmacy","apotheke","pharmacie","cvs","walgreens","boots","dm "],
 personal:["zara","h&m","primark","sephora","douglas","uniqlo","decathlon","nike","adidas","parrucch","barber","salon"],
 pets:["zooplus","petco","petsmart","arcaplanet","fressnapf"],
 kids:["toys","giocattol","prenatal","mothercare"]};
const normM=s=>String(s||"").toLowerCase().replace(/[^a-z0-9à-ÿ& ]/g," ").replace(/\s+/g," ").trim();
function rememberCat(note,cat){const k=normM(note);if(k&&k.length<60){S.merchantCats=S.merchantCats||{};S.merchantCats[k]=cat;}}
function guessCat(note){const k=normM(note);if(!k)return null;const mc=S.merchantCats||{};if(mc[k]&&S.categories.includes(mc[k]))return mc[k];
  const kk=" "+k+" ";for(const c in KW){if(S.categories.includes(c)&&KW[c].some(w=>{const x=w.trim();return x.length<=3?kk.includes(" "+x+" "):kk.includes(x);}))return c;}return null;}
function amountFromText(txt){const s=String(txt||"");
  const m=s.match(/(?:[€$£¥₹]|EUR|USD|GBP|CHF)\s?(\d[\d.,\s]*\d|\d)/i)||s.match(/(\d[\d.,\s]*\d|\d)\s?(?:[€$£¥₹]|EUR|USD|GBP|CHF)/i)||s.match(/\d+[.,]\d{2}/);
  return m?num(m[1]||m[0]):0;}
function quickAdd(){
  const h=location.hash||"";if(!/^#add\b/.test(h))return false;
  const q=new URLSearchParams(h.slice(h.indexOf("?")+1));
  try{history.replaceState(null,"","#today");}catch(e){}
  tab="today";
  let amount=num(q.get("amount")||"");let note=(q.get("note")||q.get("merchant")||"").trim();
  const text=q.get("text");
  if(!amount&&text)amount=amountFromText(text);
  if(!note&&text){const mm=String(text).match(/\b(?:presso|at|bei|chez|en|da|from|à)\s+(.{2,32}?)(?=\s+(?:con|with|mit|avec|il|on|am|le|el|per|for|carta|card|karte)\b|[,.;]|\s*$)/i);if(mm)note=mm[1].trim();}
  if(!note&&text)note=String(text).replace(/(?:[€$£¥₹]|EUR|USD|GBP|CHF)?\s?\d[\d.,\s]*\d\s?(?:[€$£¥₹]|EUR|USD|GBP|CHF)?/gi," ").replace(/\s+/g," ").trim().slice(0,40);
  if(/^(MERCHANT|NOTIFICATION)$/i.test(note))note="";
  const qc=q.get("cat");const cat=(qc&&S.categories.includes(qc))?qc:(guessCat(note)||(S.categories.includes("other")?"other":null));
  if(!S.tourSeen||tour){pre=null;return false;}
  $("#modalRoot").innerHTML="";render();
  if(q.get("auto")==="1"&&amount>0&&cat){const e={id:uid(),date:iso(today()),amount,category:cat,note,ts:Date.now()};S.expenses.push(e);save();dropRipple=true;render();
    toast(t("toast.logged",money(amount)),()=>{S.expenses=S.expenses.filter(x=>x.id!==e.id);save();render();});return true;}
  openSpend({amount:amount||"",note,cat});return true;
}
window.addEventListener("hashchange",()=>{if(/^#add\b/.test(location.hash))quickAdd();});

if(window.PP_DEMO){S=buildSample(S.settings);S.tourSeen=true;S.onboarded=true;demo=true;}
sideArt();
render();
if(!S.tourSeen)startTour();
else if(!S.onboarded){wz=0;renderWizard();}
else quickAdd();
})();
